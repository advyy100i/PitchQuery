name: eval

# Phase 6: the metric gate.
#
# Every pull request loads the committed fixture corpus, runs the same eval
# scripts that produce docs/, and compares the result against the baselines in
# eval/baselines/. A change that makes retrieval or the xG model measurably
# worse fails the job and the table says by how much.
#
# The gate measures a 40,000-possession sample, not the 67k corpus. That is
# stated in the PR comment on every run rather than buried here — see
# eval/fixtures/make_fixture.py for why that particular size, and for the two
# earlier attempts that produced a gate which passed a ranker with the zone
# information deleted out of it.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A second push to the same PR makes the first run's numbers irrelevant.
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pitchquery
          POSTGRES_PASSWORD: pitchquery
          POSTGRES_DB: pitchquery
        ports:
          - 5432:5432
        # Without the health check the first psql runs against a container that
        # has started but not finished initialising, and the job fails on a
        # connection refused that has nothing to do with the diff.
        options: >-
          --health-cmd "pg_isready -U pitchquery -d pitchquery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://pitchquery:pitchquery@localhost:5432/pitchquery
      # Somewhere empty, so core/config.py finds no prebuilt TF-IDF pickle and
      # Retriever fits the index from the fixture instead. A stale pickle here
      # would silently measure the wrong matrix.
      PITCHQUERY_DATA: ${{ runner.temp }}/pitchquery-data
      PITCHQUERY_DENSE: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install
        run: pip install -r requirements-ci.txt

      - name: Load the fixture corpus
        run: |
          set -euo pipefail
          for f in sql/001_schema.sql sql/002_indexes.sql sql/003_watermark.sql; do
            psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL" -f "$f"
          done
          gunzip -c eval/fixtures/corpus.sql.gz \
            | psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL"
          psql -q "$DATABASE_URL" -c \
            "select (select count(*) from possessions) possessions,
                    (select count(*) from shots) shots;"

      - name: Tests
        run: pytest -q

      - name: Score retrieval
        run: python eval/score_retrieval.py --sparse-only

      - name: Score the shipped xG model
        run: python eval/score_xg.py

      - name: Metric gate
        id: gate
        # The comparison must not stop the report from being written: a gate
        # that fails without saying which metric moved is a gate people learn to
        # rerun rather than read. Capture the status, publish, fail later.
        run: |
          set +e
          python ci/compare_metrics.py --out metrics-report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat metrics-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          # GITHUB_TOKEN only. No app, no secret, nothing that expires.
          script: |
            const fs = require('fs');
            const marker = '<!-- pitchquery-metric-gate -->';
            const body = marker + '\n' + fs.readFileSync('metrics-report.md', 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            // Update in place rather than appending. Six pushes to a branch
            // should leave one comment showing the current numbers, not six
            // showing a history nobody reads.
            const existing = await github.paginate(
              github.rest.issues.listComments, {owner, repo, issue_number});
            const mine = existing.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment(
                {owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Fail if a metric regressed
        if: steps.gate.outputs.status != '0'
        run: |
          echo "the metric gate blocked this change — see the comment on the PR"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-metrics
          path: |
            eval/out/
            metrics-report.md
            docs/retrieval_eval.md
