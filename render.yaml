# Render blueprint for the API. Create the service from this file with
# "New > Blueprint" and point it at the repo.
#
# The frontend is NOT here — it goes to Vercel, which is free and purpose-built
# for Next.js. This deploys the FastAPI service only.
#
# Region is pinned to Ohio to sit next to a Neon us-east-2 database. A
# cross-region pair adds ~60 ms to every query, and these endpoints make
# several.
#
# Two environment variables must be set by hand in the Render dashboard because
# they carry a secret or a URL that does not exist yet (`sync: false` below
# means "prompt me, do not read from this file"):
#
#   DATABASE_URL              the Neon connection string, including ?sslmode=require
#   PITCHQUERY_CORS_ORIGINS   the deployed Vercel URL, e.g. https://pitchquery.vercel.app
#
# Set CORS after the first Vercel deploy, when you know the URL. Until then the
# API answers curl but a browser will block the frontend's requests.

services:
  - type: web
    name: pitchquery-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"

      # Free tier is 512 MB RAM. torch alone exceeds that, so the dense ranker
      # is off and the API serves sparse + shape + planner. Retrieval quality
      # drops from the fused P@5 of 0.608 to the sparse 0.544; see the README.
      - key: PITCHQUERY_DENSE
        value: "0"

      # Cache the 67k zone paths at boot. Measured resident memory with it
      # loaded is 277 MB, well inside the 512 MB limit, and building it lazily
      # instead makes the first drawn query pay for fetching 67k rows from the
      # database — which is several seconds a user would sit through.
      - key: PITCHQUERY_PRELOAD_SHAPES
        value: "1"

      # The xG model IS served. Unlike the dense ranker it costs almost nothing:
      # models/xg_portable.json.gz is 599 KB and ships in the repo, and lightgbm
      # takes resident memory from 264 MB to 271 MB. The model was exported out
      # of its pickle into LightGBM's own text format precisely so that hosting
      # it does not mean pinning scikit-learn and pandas to a laptop's versions.
      # Set to 0 to drop it if the box ever runs short.
      - key: PITCHQUERY_XG
        value: "1"

      - key: DATABASE_URL
        sync: false
      - key: PITCHQUERY_CORS_ORIGINS
        sync: false
